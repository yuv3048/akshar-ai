name = "akshar-auth-service"
main = "src/app.ts"
compatibility_date = "2026-10-10"
compatibility_flags = ["nodejs_compat"]

[[queues.producers]]
binding = "AUTH_EMAIL_QUEUE"
queue = "akshar-auth-email"

[[durable_objects.bindings]]
name = "AUTH_STATE"
class_name = "AuthStateDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthStateDO"]
